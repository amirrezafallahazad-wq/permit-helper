<style>
:root{--tx:#0f172a;--mu:#64748b;--bd:#e2e8f0;--ac:#2563eb;--er:#e11d48;--bg:#f1f5fb}
*{box-sizing:border-box}
body{margin:0;color:var(--tx);font-family:Vazirmatn,Tahoma,sans-serif;min-height:100vh;background:var(--bg) linear-gradient(180deg,#dbeafe,transparent 320px) no-repeat}
.wrap{max-width:1100px;margin:auto;padding:20px}
.card{background:#fff;border:1px solid var(--bd);border-radius:20px;padding:22px;box-shadow:0 8px 24px rgba(37,99,235,.07)}
.login{max-width:420px;margin:10vh auto;padding:34px;text-align:center}.login label,.login .l{text-align:right}
.logo{height:52px;margin-bottom:14px}
h1{font-size:20px;margin:4px 0;font-weight:800}h2{font-size:16px;margin:0 0 12px}.mu{color:var(--mu);font-size:13px}
label{display:block;font-size:12px;font-weight:600;color:var(--mu);margin-top:10px}
input,textarea,select{width:100%;font:inherit;color:var(--tx);background:#f8fafc;border:1px solid var(--bd);border-radius:12px;padding:12px 14px;outline:none;margin:6px 0 10px;transition:.15s}
input:focus,textarea:focus,select:focus{border-color:var(--ac);background:#fff;box-shadow:0 0 0 3px rgba(37,99,235,.15)}
textarea{min-height:170px;resize:vertical;line-height:1.9}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:11px 20px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--ac),#4f46e5);transition:.15s}
button:hover{filter:brightness(1.08)}
button.g{background:#fff;color:var(--tx);border:1px solid var(--bd)}button.d{background:var(--er)}button.sm{padding:6px 12px;font-size:12px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px;background:#fff;border:1px solid var(--bd);border-radius:20px;padding:12px 18px;box-shadow:0 8px 24px rgba(37,99,235,.07)}.top img{height:38px;border-radius:8px}
.tabs{display:flex;gap:4px;background:#f1f5f9;padding:4px;border-radius:14px;flex-wrap:wrap}
.tabs button{background:none;color:var(--mu);padding:8px 16px}.tabs button.on{background:#fff;color:var(--ac);box-shadow:0 1px 4px rgba(15,23,42,.12)}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;margin-top:8px}
.cat{cursor:pointer;padding:34px 28px;border-radius:24px;background:#fff;border:1px solid var(--bd);border-top:5px solid var(--c);box-shadow:0 8px 24px rgba(15,23,42,.06);transition:.2s}
.cat:hover{transform:translateY(-4px);box-shadow:0 16px 36px rgba(15,23,42,.13)}.cat .ic{font-size:40px;margin-bottom:10px}.cat h2{font-size:19px;margin:0 0 6px}.cat.p{--c:#2563eb}.cat.f{--c:#f59e0b}
.grid{display:grid;grid-template-columns:340px 1fr;gap:16px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}@media(max-width:820px){.grid,.g2{grid-template-columns:1fr}}
.list{max-height:540px;overflow:auto;display:flex;flex-direction:column;gap:6px}
.it{padding:10px 12px;border-radius:12px;border:1px solid var(--bd);background:#fff;cursor:pointer;font-size:13px;line-height:1.7;display:flex;gap:8px;justify-content:space-between;align-items:center}
.it:hover{border-color:var(--ac)}.it.on{background:#eff6ff;border-color:var(--ac)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}.st b{display:block;font-size:28px;font-weight:800;color:var(--ac)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:10px;text-align:right;border-bottom:1px solid var(--bd);white-space:nowrap}td.w{white-space:normal;min-width:240px}
.bar{height:8px;border-radius:6px;background:linear-gradient(90deg,#06b6d4,var(--ac));margin-top:4px}
.err{color:var(--er);font-size:13px;min-height:20px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pill{font-size:11px;padding:3px 10px;border-radius:20px;background:#dbeafe;color:var(--ac)}
a.lnk{color:var(--ac);cursor:pointer;font-size:13px}
</style>
</head>

async function rpc(fn,a={}){
 const r=await fetch(CFG.url+"/rest/v1/rpc/"+fn,{method:"POST",headers:{apikey:CFG.key,...(CFG.key.startsWith("eyJ")?{Authorization:"Bearer "+CFG.key}:{}),"Content-Type":"application/json"},body:JSON.stringify(a)});

const A=(fn,a={})=>rpc(fn,{p_token:S.token,...a});
const COMP=["البرز","آرمان","آسیا","سینا","ایران","ما","کوثر","معلم","پارسیان","تجارت نو","تعاون","سامان","نوین","حکمت","دی","رازی","پردیس","هوشمند فردا"];
const coOpts=()=>'<option value="">انتخاب شرکت بیمه…</option>'+COMP.map(c=>`<option ${S.co===c?"selected":""}>${c}</option>`).join("");
const CATS={permit:["پیام‌های مجوزی","📄","p"],fix:["پیام‌های اصلاحی","🛠️","f"]};
const cOf=x=>x.category==="fix"?"fix":"permit",inCat=x=>cOf(x)===S.cat;
const T=()=>{const l=S.tpls.filter(inCat);return l.find(x=>x.id===S.sel)||l[0]};
function home(){return`<div class="cats">${Object.entries(CATS).map(([k,v])=>`<div class="cat ${v[2]}" onclick="openCat('${k}')"><div class="ic">${v[1]}</div><h2>${v[0]}</h2><p class="mu">${S.tpls.filter(x=>cOf(x)===k).length} قالب</p></div>`).join("")}</div>`}
function openCat(k){S.cat=k;S.q="";S.ex={};S.msg="";const l=S.tpls.filter(inCat);S.sel=l[0]&&l[0].id;render()}

 const t=T(),q=S.q.trim();
 const items=S.tpls.filter(x=>inCat(x)&&(!q||x.error.includes(q))).map(x=>`<div class="it ${t&&x.id===t.id?"on":""}" onclick="pick(${x.id})">${esc(x.error.length>110?x.error.slice(0,110)+"…":x.error)}</div>`).join("")||'<p class="mu">موردی پیدا نشد</p>';
 const ex=t?phs(t).map(p=>`<label>${esc(p)}</label><input data-p="${esc(p)}" value="${esc(S.ex[p]||"")}" oninput="S.ex[this.dataset.p]=this.value;upd()">`).join(""):"";
 return `<div class="row" style="margin-bottom:14px"><button class="g sm" onclick="S.cat=null;render()">→ بازگشت</button><b>${CATS[S.cat][0]}</b></div><div class="grid"><div class="card"><h2>خطای دریافتی</h2><input id="q" placeholder="جستجو در خطاها…" value="${esc(S.q)}" oninput="S.q=this.value;render();const i=$('#q');i.focus();i.setSelectionRange(99,99)"><div class="list">${items}</div></div>
 <div class="card"><h2>ساخت پیام</h2><label>کد رایانه</label><input id="code" inputmode="numeric" placeholder="کد رایانه را وارد کنید" value="${esc(S.codeIn)}" oninput="S.codeIn=this.value;upd()"><label>شرکت بیمه</label><select id="co" onchange="S.co=this.value">${coOpts()}</select>${ex}
 <label>پیام نهایی</label><textarea id="out" readonly>${esc(build(t))}</textarea><div class="row"><button onclick="copy()">کپی پیام</button><span class="mu" id="ok">${esc(S.msg)}</span></div></div></div>`}
function upd(){$("#out").value=build(T())}
function pick(i){S.sel=i;S.ex={};S.msg="";render()}
function tab(t){S.tab=t;if(t==="gen")S.cat=null;S.msg="";if(t==="logs")load("logs");if(t==="users")load("users");render()}
async function copy(){
 const t=T();if(!S.codeIn.trim()){$("#ok").textContent="اول کد رایانه را وارد کنید";return}
 if(!S.co){$("#ok").textContent="شرکت بیمه را انتخاب کنید";return}
 const o=$("#out");try{await navigator.clipboard.writeText(o.value)}catch(e){o.select();document.execCommand("copy")}
 $("#ok").textContent="کپی شد ✓";
 try{await A("pm_log_use",{p_tpl:t.id,p_err:t.error.slice(0,90),p_code:S.codeIn.trim(),p_company:S.co})}catch(e){}}
async function load(w){try{if(w==="logs")S.logs=await A("pm_get_logs");if(w==="users"){S.users=await A("pm_list_users");S.code=await A("pm_get_signup_code")}if(w==="tpls")S.tpls=await A("pm_get_templates")}catch(e){}render()}
function logsV(){
 const AL=S.logs,L=AL.filter(l=>!S.fc||l.company===S.fc),d=new Date();d.setHours(0,0,0,0);
 const by=(k,n=6,Z=L)=>{const m={};Z.forEach(l=>m[l[k]]=(m[l[k]]||0)+1);return Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,n)};const cm=by("company",30,AL.filter(l=>l.company));
 const bars=(arr,f)=>{const mx=arr[0]?arr[0][1]:1;return arr.map(([k,v])=>`<div style="margin-bottom:10px"><div class="row" style="justify-content:space-between"><span>${esc(f(k))}</span><b>${v}</b></div><div class="bar" style="width:${Math.max(6,v/mx*100)}%"></div></div>`).join("")||'<p class="mu">هنوز داده‌ای نیست</p>'};
 return `<div class="stats"><div class="card st"><span class="mu">کل استفاده‌ها</span><b>${L.length}</b></div><div class="card st"><span class="mu">امروز</span><b>${L.filter(l=>new Date(l.created_at)>=d).length}</b></div><div class="card st"><span class="mu">کاربران فعال</span><b>${by("username").length}</b></div><div class="card st"><span class="mu">شرکت پرمجوز</span><b style="font-size:20px">${cm[0]?esc(cm[0][0]):"—"}</b></div></div>
 <div class="card" style="margin-bottom:16px"><div class="row" style="justify-content:space-between"><h2>مجوزها به تفکیک شرکت بیمه</h2><select style="width:auto;margin:0" onchange="S.fc=this.value;render()"><option value="">همه شرکت‌ها</option>${COMP.map(c=>`<option ${S.fc===c?"selected":""}>${c}</option>`).join("")}</select></div>${bars(cm,k=>k)}<p class="mu">با انتخاب یک شرکت، آمار کاربران و خطاهای پایین فقط برای همان شرکت نشان داده می‌شود.</p></div>
 <div class="g2"><div class="card"><h2>پرکاربردترین کاربران</h2>${bars(by("username"),k=>k)}</div><div class="card"><h2>پرتکرارترین خطاها</h2>${bars(by("err"),k=>k.slice(0,55))}</div></div>
 <div class="card"><h2>لاگ استفاده‌ها (۲۰۰ مورد آخر)</h2><div class="tw"><table><tr><th>زمان</th><th>کاربر</th><th>کد رایانه</th><th>شرکت</th><th>خطا</th></tr>${L.slice(0,200).map(l=>`<tr><td>${new Date(l.created_at).toLocaleString("fa-IR")}</td><td>${esc(l.username)}</td><td>${esc(l.code)}</td><td>${esc(l.company||"—")}</td><td class="w">${esc(l.err)}</td></tr>`).join("")}</table></div></div>`}
function tplsV(){
 const e=S.ed;
 return `<div class="grid"><div class="card"><div class="row" style="justify-content:space-between"><h2>قالب‌ها (${S.tpls.length})</h2><button class="sm" onclick="edit(null)">+ قالب جدید</button></div><div class="list">${S.tpls.map(x=>`<div class="it ${e.id===x.id?"on":""}"><span onclick="edit(${x.id})" style="flex:1">${esc(x.error.slice(0,90))}</span><span class="pill">${cOf(x)==="fix"?"اصلاحی":"مجوزی"}</span><button class="d sm" onclick="delT(${x.id})">حذف</button></div>`).join("")}</div></div>
 <div class="card"><h2>${e.id?"ویرایش قالب":"قالب جدید"}</h2><label>دسته</label><select onchange="S.ed.category=this.value"><option value="permit" ${e.category!=="fix"?"selected":""}>پیام‌های مجوزی</option><option value="fix" ${e.category==="fix"?"selected":""}>پیام‌های اصلاحی</option></select><label>عنوان خطا</label><input id="te" value="${esc(e.error)}" oninput="S.ed.error=this.value">
 <label>متن کامل پیام (جای کد رایانه بنویسید [کد رایانه]؛ هر [متغیر] دیگر خودکار فیلد ورودی می‌شود)</label><textarea id="tt" style="min-height:240px" oninput="S.ed.template=this.value">${esc(e.template)}</textarea>
 <div class="err" id="e"></div><div class="row"><button onclick="saveT()">ذخیره</button><button class="g" onclick="edit(null)">انصراف</button></div></div></div>`}
function edit(id){const t=S.tpls.find(x=>x.id===id);S.ed=t?{id:t.id,error:t.error,template:t.template,category:cOf(t)}:{category:"permit",id:null,error:"",template:"خطا: \nکد رایانه: [کد رایانه]\n"};render()}
async function saveT(){if(!S.ed.error.trim()||!S.ed.template.trim()){$("#e").textContent="عنوان و متن را پر کنید";return}
 try{await A("pm_save_template",{p_id:S.ed.id,p_error:S.ed.error.trim(),p_template:S.ed.template,p_category:S.ed.category});S.ed={id:null,error:"",template:"",category:"permit"};await load("tpls")}catch(e){$("#e").textContent=e.message}}
async function delT(id){if(confirm("این قالب حذف شود؟"))try{await A("pm_delete_template",{p_id:id});if(S.sel===id)S.sel=null;await load("tpls")}catch(e){alert(e.message)}}
function usersV(){
 return `<div class="card" style="margin-bottom:16px"><h2>کد ثبت‌نام</h2><p class="mu">همکاران برای ساخت حساب این کد را وارد می‌کنند. با لینک و این کد ثبت‌نام می‌کنند.</p><div class="row"><input id="sc" style="max-width:260px;margin:0" value="${esc(S.code)}"><button onclick="setCode()">ذخیره کد</button><span class="mu" id="ok"></span></div></div>
 <div class="card"><h2>کاربران (${S.users.length})</h2><div class="tw"><table><tr><th>نام</th><th>نام کاربری</th><th>تعداد استفاده</th><th>نقش</th><th></th></tr>${S.users.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.username)}</td><td>${u.uses}</td><td><span class="pill">${u.role=="admin"?"مدیر":"کاربر"}</span></td><td>${u.username===S.me.username?"":`<button class="g sm" onclick="setRole('${u.id}','${u.role=="admin"?"user":"admin"}')">${u.role=="admin"?"تبدیل به کاربر":"ارتقا به مدیر"}</button> <button class="g sm" onclick="resetP('${u.id}')">ریست رمز</button> <button class="d sm" onclick="delU('${u.id}')">حذف</button>`}</td></tr>`).join("")}</table></div></div>`}
async function setCode(){try{await A("pm_set_signup_code",{p_code:$("#sc").value.trim()});S.code=$("#sc").value.trim();$("#ok").textContent="ذخیره شد ✓"}catch(e){$("#ok").textContent=e.message}}
async function setRole(id,r){try{await A("pm_set_role",{p_user:id,p_role:r});load("users")}catch(e){alert(e.message)}}
async function resetP(id){const p=prompt("رمز جدید (حداقل ۶ کاراکتر):");if(p)try{await A("pm_reset_password",{p_user:id,p_pass:p});alert("رمز تغییر کرد")}catch(e){alert(e.message)}}
async function delU(id){if(confirm("کاربر حذف شود؟"))try{await A("pm_delete_user",{p_user:id});load("users")}catch(e){alert(e.message)}}
async function auth(){
 const u=$("#u").value,p=$("#p").value;
 try{S.token=S.reg?await rpc("pm_register",{p_username:u,p_name:$("#nm").value,p_password:p,p_code:$("#rc").value}):await rpc("pm_login",{p_username:u,p_password:p});
  try{localStorage.setItem("tk",S.token)}catch(e){}await boot()}catch(e){$("#e").textContent=e.message}}
function logout(){S.cat=null;S.token=null;S.me=null;S.tab="gen";try{localStorage.removeItem("tk")}catch(e){}render()}
async function boot(){
 if(S.token){try{S.me=await A("pm_me");S.tpls=await A("pm_get_templates");S.sel=S.tpls[0]&&S.tpls[0].id}catch(e){S.me=null;S.token=null}}
 S.busy=false;render()}
render();boot();
</script></body></html>
